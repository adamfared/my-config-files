# Backend & System Settings
backend = "glx";
vsync = true;
use-damage = true;
log-level = "warn";

# Disable Rounded Corners & Borders
corner-radius = 0;
inner-border-width = 0;

# Basic Shadows
shadow = false;
shadow-radius = 15;
shadow-opacity = 0.3;
shadow-offset-x = -15;
shadow-offset-y = -15;

# Dual-Kawase Background Blur Settings
blur: {
  method = "dual_kawase";
  strength = 3;
};

# Unified Window Rules (Replaces opacity-rule & blur-background-exclude)
rules = (
  {
    # Exclude docks (Polybar) and desktop background from shadows and blur
    match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false;
    corner-radius = 0;
    blur-background = false;
  },
  {
    # Apply 85% opacity to terminal applications
    match = "class_g = 'Alacritty' || class_g = 'kitty' || class_g = 'st-256color' || class_g = 'foot'";
    opacity = 1.0;
  }
);

# Clean Zoom + Slide Animations (Open / Close)
animations = ({
    triggers = ["open", "show"];
    opacity = {
        curve = "linear";
        duration = 0.25;
        start = 0;
        end = "window-raw-opacity";
    };
    scale-x = {
        curve = "cubic-bezier(0.1, 0.9, 0.2, 1.0)";
        duration = 0.25;
        start = 0.85;
        end = 1;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
}, {
    triggers = ["close", "hide"];
    opacity = {
        curve = "linear";
        duration = 0.20;
        start = "window-raw-opacity-before";
        end = 0;
    };
    scale-x = {
        curve = "cubic-bezier(0.7, 0, 0.84, 0.0)";
        duration = 0.20;
        start = 1;
        end = 0.85;
    };
    scale-y = "scale-x";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
});

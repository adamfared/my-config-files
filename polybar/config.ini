[colors]
# ARGB Format: #AA (Alpha/Transparency) + #RRGGBB (Color)
# #aa000000 = ~66% semi-transparent black (#000000)
# Use #00000000 for 100% full transparency
background = #aa000000
background-alt = #32344a
foreground = #a9b1d6
primary = #7dcfff
alert = #f7768e

[bar/main]
width = 100%
height = 20pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
border-size = 0pt

padding-left = 0
padding-right = 1
module-margin = 1

# JetBrains Mono Nerd Font with size 9 and vertical offset 2
font-0 = "JetBrainsMono Nerd Font:size=9;2"

modules-left = bspwm
modules-center = title
modules-right = date

cursor-click = pointer
cursor-scroll = ns-resize

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = #414868
label-empty-padding = 2

[module/title]
type = internal/xwindow
label = %title:0:30:...%

[module/date]
type = internal/date
interval = 1

# 12-hour format with AM/PM (e.g., 2026-09-11 02:30 PM)
date = %Y-%m-%d %I:%M %p
label = %date%
label-foreground = ${colors.primary}
